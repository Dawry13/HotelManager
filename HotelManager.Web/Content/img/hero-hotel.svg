<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c3d"/>
      <stop offset=".45" stop-color="#3a1c72"/>
      <stop offset=".78" stop-color="#8a3f8f"/>
      <stop offset="1" stop-color="#e98a6a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc8"/>
      <stop offset="1" stop-color="#b9a68d"/>
    </linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1f4d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2a1f4d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a1"/>
      <stop offset="1" stop-color="#ff9f3f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a4f"/>
      <stop offset="1" stop-color="#20162f"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6fa3"/>
      <stop offset="1" stop-color="#0b2a55"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset=".6" stop-color="#ffe7b0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="windows" width="46" height="42" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="34" height="28" rx="2" fill="url(#win)"/>
      <rect x="22" y="6" width="2" height="28" fill="#7a4a2a" opacity=".5"/>
    </pattern>
    <g id="palm">
      <path d="M0 0 C 4 -60, 10 -120, 6 -180" stroke="#130b25" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="#130b25">
        <path d="M6 -180 C -40 -200, -80 -180, -110 -150 C -70 -170, -30 -175, 6 -172 Z"/>
        <path d="M6 -180 C 50 -205, 95 -190, 120 -160 C 80 -178, 40 -180, 6 -172 Z"/>
        <path d="M6 -182 C -20 -230, -60 -240, -90 -232 C -50 -222, -20 -205, 2 -176 Z"/>
        <path d="M6 -182 C 30 -232, 75 -242, 100 -228 C 60 -222, 30 -205, 10 -176 Z"/>
        <path d="M6 -180 C 0 -225, 10 -250, 25 -262 C 18 -240, 14 -210, 10 -178 Z"/>
        <path d="M6 -178 C -30 -170, -60 -140, -70 -110 C -50 -140, -25 -158, 4 -170 Z"/>
        <path d="M6 -178 C 40 -170, 70 -140, 82 -112 C 60 -140, 35 -158, 8 -170 Z"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#fff">
    <circle cx="520" cy="40" r="1.4" opacity=".8"/><circle cx="600" cy="80" r="1" opacity=".6"/>
    <circle cx="690" cy="30" r="1.6" opacity=".9"/><circle cx="780" cy="60" r="1" opacity=".5"/>
    <circle cx="880" cy="25" r="1.3" opacity=".8"/><circle cx="960" cy="70" r="1" opacity=".6"/>
    <circle cx="1040" cy="35" r="1.5" opacity=".9"/><circle cx="1150" cy="55" r="1.1" opacity=".7"/>
    <circle cx="450" cy="90" r="1" opacity=".5"/><circle cx="1110" cy="110" r="1" opacity=".5"/>
  </g>
  <circle cx="1080" cy="80" r="70" fill="url(#moon)"/>
  <circle cx="1080" cy="80" r="22" fill="#fff4d6"/>

  <!-- colinas lejanas -->
  <path d="M380 300 C 520 250, 640 270, 760 255 C 900 238, 1050 262, 1200 245 L1200 320 L380 320 Z" fill="#2b1650" opacity=".7"/>

  <!-- resplandor del hotel -->
  <ellipse cx="860" cy="250" rx="360" ry="120" fill="url(#glow)"/>

  <!-- hotel: cuerpo principal -->
  <g>
    <!-- planta 3 -->
    <rect x="600" y="110" width="430" height="70" fill="url(#wall)"/>
    <rect x="590" y="100" width="450" height="12" fill="url(#roof)"/>
    <rect x="612" y="122" width="406" height="48" fill="url(#windows)"/>
    <!-- planta 2 -->
    <rect x="570" y="180" width="490" height="70" fill="url(#wall)"/>
    <rect x="560" y="176" width="510" height="8" fill="#d8c6ab"/>
    <rect x="582" y="192" width="466" height="48" fill="url(#windows)"/>
    <rect x="570" y="232" width="490" height="6" fill="#3a2b2a" opacity=".55"/>
    <!-- planta 1 -->
    <rect x="540" y="250" width="550" height="75" fill="url(#wall)"/>
    <rect x="530" y="246" width="570" height="8" fill="#d8c6ab"/>
    <rect x="552" y="262" width="526" height="52" fill="url(#windows)"/>
    <!-- sombra lateral -->
    <rect x="540" y="100" width="120" height="225" fill="url(#wallShade)"/>
    <!-- columnas -->
    <g fill="#cdb894">
      <rect x="640" y="250" width="8" height="75"/><rect x="760" y="250" width="8" height="75"/>
      <rect x="880" y="250" width="8" height="75"/><rect x="1000" y="250" width="8" height="75"/>
    </g>
    <!-- barandas -->
    <g stroke="#2a1f2f" stroke-width="2" opacity=".6">
      <line x1="570" y1="226" x2="1060" y2="226"/><line x1="600" y1="160" x2="1030" y2="160"/>
    </g>
  </g>

  <!-- terraza y piscina -->
  <rect x="380" y="325" width="820" height="75" fill="#1a1230"/>
  <path d="M470 345 L1180 345 L1200 400 L430 400 Z" fill="url(#pool)"/>
  <g fill="#ffcf7a" opacity=".55">
    <rect x="600" y="352" width="60" height="3" rx="1.5"/><rect x="700" y="362" width="90" height="3" rx="1.5"/>
    <rect x="840" y="355" width="70" height="3" rx="1.5"/><rect x="950" y="368" width="100" height="3" rx="1.5"/>
    <rect x="640" y="378" width="80" height="3" rx="1.5"/><rect x="880" y="384" width="60" height="3" rx="1.5"/>
  </g>
  <g fill="#ffd27a">
    <circle cx="520" cy="333" r="3"/><circle cx="700" cy="333" r="3"/><circle cx="880" cy="333" r="3"/><circle cx="1060" cy="333" r="3"/>
  </g>

  <!-- palmeras -->
  <use href="#palm" transform="translate(480 330) scale(1.05)"/>
  <use href="#palm" transform="translate(540 335) scale(.75) rotate(6)"/>
  <use href="#palm" transform="translate(1120 330) scale(1.15) rotate(-4)"/>
  <use href="#palm" transform="translate(1180 340) scale(.85) rotate(5)"/>
  <use href="#palm" transform="translate(420 345) scale(.6) rotate(-6)"/>
</svg>
